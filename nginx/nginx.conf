# ==============================================================================
# SRI LAKSHMI DURGA AGENCIES — PRODUCTION NGINX REVERSE PROXY CONFIGURATION
# ARCHITECTURAL SUBDOMAIN ISOLATION & DEFENSE-IN-DEPTH EDGE ROUTING
# ==============================================================================
# Customer Subdomain: app.srilakshmidurgaagencies.com -> dist/customer
# Admin Subdomain:    admin.srilakshmidurgaagencies.com -> dist/admin
# API Gateway:        api.srilakshmidurgaagencies.com  -> Express Backend (5000)
# ==============================================================================

user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging with origin and timing metrics
    log_format portal_combined '$remote_addr - $remote_user [$time_local] '
                               '"$request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent" '
                               'Host: "$host" Origin: "$http_origin" '
                               'RT: $request_time UCT: $upstream_connect_time';

    access_log /var/log/nginx/access.log portal_combined;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens   off; # Prevent Nginx version fingerprinting

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/rss+xml application/atom+xml image/svg+xml;

    # Rate Limiting Zones
    limit_req_zone $binary_remote_addr zone=api_customer_zone:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_admin_zone:10m rate=15r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit_zone:10m rate=5r/m;

    # Upstream Express Application
    upstream node_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    # SSL Global Defaults (TLS 1.2 & 1.3 Strict)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ==========================================================================
    # HTTP -> HTTPS REDIRECT (PORT 80)
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name app.srilakshmidurgaagencies.com
                    admin.srilakshmidurgaagencies.com
                    api.srilakshmidurgaagencies.com;

        # ACME Challenge for Let's Encrypt Renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # 1. CUSTOMER PORTAL — app.srilakshmidurgaagencies.com (PORT 443)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name app.srilakshmidurgaagencies.com;

        ssl_certificate     /etc/letsencrypt/live/app.srilakshmidurgaagencies.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/app.srilakshmidurgaagencies.com/privkey.pem;

        # Hardened Security Headers (Customer Scope)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://checkout.razorpay.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co; connect-src 'self' https://*.supabase.co https://api.razorpay.com https://lumberjack.razorpay.com; frame-src 'self' https://api.razorpay.com;" always;

        # Root directory points strictly to isolated customer build
        root /var/www/slda/frontend/dist/customer;
        index index.html;

        # ----------------------------------------------------------------------
        # EDGE DEFENSE: HARD-BLOCK ANY ADMIN PATH AT CUSTOMER DOMAIN
        # An attacker accessing app.<domain>.com/api/v1/admin or /admin/* is immediately
        # rejected at the Nginx edge before the backend is ever contacted.
        # ----------------------------------------------------------------------
        location ~* ^/(api/v1/admin|admin) {
            access_log /var/log/nginx/blocked_admin_probes.log portal_combined;
            return 404 '{"success":false,"message":"Route does not exist on Customer Portal"}';
            default_type application/json;
        }

        # Customer Namespaced API Proxy
        location /api/v1/customer/ {
            limit_req zone=api_customer_zone burst=20 nodelay;

            proxy_pass http://node_backend/api/v1/customer/;
            proxy_http_version 1.1;

            # Clear any potentially spoofed upstream headers
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            proxy_hide_header X-Powered-By;
        }

        # Backwards-compatible customer API proxy
        location /api/ {
            limit_req zone=api_customer_zone burst=20 nodelay;

            proxy_pass http://node_backend/api/;
            proxy_http_version 1.1;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            proxy_hide_header X-Powered-By;
        }

        # Static Assets with High-Performance Caching
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Single-Page App fallback
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ==========================================================================
    # 2. ADMINISTRATOR PORTAL — admin.srilakshmidurgaagencies.com (PORT 443)
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name admin.srilakshmidurgaagencies.com;

        ssl_certificate     /etc/letsencrypt/live/admin.srilakshmidurgaagencies.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/admin.srilakshmidurgaagencies.com/privkey.pem;

        # Hardened Security Headers (Admin Operations Scope)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://*.supabase.co blob:; connect-src 'self' https://*.supabase.co;" always;

        # Root directory points strictly to isolated administrator build
        root /var/www/slda/frontend/dist/admin;
        index admin.html;

        # Admin Namespaced API Proxy
        location /api/v1/admin/ {
            limit_req zone=api_admin_zone burst=10 nodelay;

            proxy_pass http://node_backend/api/v1/admin/;
            proxy_http_version 1.1;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            # Enforce upstream cookies remain host-isolated
            proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";

            proxy_hide_header X-Powered-By;
        }

        # Backwards-compatible admin API proxy
        location /api/ {
            limit_req zone=api_admin_zone burst=10 nodelay;

            proxy_pass http://node_backend/api/;
            proxy_http_version 1.1;

            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Host $host;

            proxy_cookie_path / "/; Secure; HttpOnly; SameSite=Strict";

            proxy_hide_header X-Powered-By;
        }

        # Static Assets Caching
        location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # Single-Page App fallback for Admin (admin.html)
        location / {
            try_files $uri $uri/ /admin.html;
        }
    }
}
